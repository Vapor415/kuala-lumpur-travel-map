<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>吉隆坡旅行地图 · 4 天 3 晚</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="panel">
    <header><div class="eyebrow">MALAYSIA / NOVEMBER 2026</div><h1>吉隆坡旅行地图<span>4 天 3 晚的地点收藏</span></h1><p>11 月 3–6 日 · 南京出发 · 返程分飞南京与西安</p></header>
    <div class="filters">
      <label class="search"><span>搜索地点</span><input id="search" type="search" placeholder="双子塔、清真寺、机场…"></label>
      <div class="select-row"><label>行程日期<select id="day"><option value="all">全部日期</option><option value="1">11/3 · 抵达与夜景</option><option value="2">11/4 · 老城与布城</option><option value="3">11/5 · 水族馆与演唱会</option><option value="4">11/6 · 休息退房与返程</option></select></label><label>地图区域<select id="region"><option value="all">全部区域</option><option value="kl">吉隆坡</option><option value="putrajaya">布城</option><option value="airport">机场</option></select></label></div>
      <div id="categories" class="chips" aria-label="地点类型"></div>
      <label id="route-choice" class="route-choice" hidden>11/6 返程航站楼（以机票为准）<select id="terminal"><option value="klia1">吉隆坡机场 T1</option><option value="klia2">吉隆坡机场 T2</option></select></label>
      <label class="toggle"><input id="alternatives" type="checkbox" checked>显示备选交通</label>
    </div>
    <div class="list-heading"><strong id="count"></strong><button id="fit" type="button">查看全部结果 ↗</button></div>
    <div id="places" class="places" aria-live="polite"></div>
    <footer>地图用于行程展示。点位为概略定位，区域与街道使用代表点；请通过详情中的地图搜索确认入口。<details><summary>行程来源与未定位内容</summary><p>以《吉隆坡4天3晚行程计划》为准。地图与行程展示不包含餐饮点位及餐饮安排；南京、西安及昆明为返程或中转参考，不纳入当地地图。所有时间为当地时间。</p></details></footer>
  </aside>
  <main><div id="map" aria-label="旅行地点地图"></div><div class="map-title"><b>一张地图，看懂这趟旅程</b><span>吉隆坡 · 布城 · 11/3–6</span></div><div class="map-actions"><button id="city" type="button">⌂ 市区视图</button><button id="overview" type="button">◎ 旅行全域</button><button id="export" type="button">↓ GeoJSON</button></div><div id="status" role="status" hidden></div></main>
  <aside id="map-legend" class="map-legend" aria-label="当前视野标注图例"><div class="legend-heading"><strong>标注图例 · 区域树</strong><button id="legend-toggle" type="button" aria-expanded="true" aria-controls="legend-items">收起</button></div><div id="legend-scale" class="legend-scale" aria-live="polite"></div><p class="legend-key">合并数字：地点数 · 路线数字：站次</p><div id="legend-items" class="legend-items"></div></aside>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
  <script src="basemap-style.js"></script>
  <script src="places.js"></script><script src="map.js"></script>
</body>
</html>
